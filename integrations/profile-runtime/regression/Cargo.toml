[package]
name = "profile-runtime-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "profile-runtime-probe"
path = "probe.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
hmac = "0.12.1"
netstat2 = "0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.38.4"
uuid = { version = "1", features = ["v4"] }
winreg = "0.56.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
